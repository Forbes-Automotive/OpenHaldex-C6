<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="800" height="270" fill="#ffffff"/>
  <g font-size="13" fill="#0b0f14">
    <!-- panel frames -->
    <g fill="#f3f6f8" stroke="#d5dce3" stroke-width="1.5">
      <rect x="10" y="10" width="185" height="250" rx="10"/><rect x="207" y="10" width="185" height="250" rx="10"/>
      <rect x="404" y="10" width="185" height="250" rx="10"/><rect x="601" y="10" width="189" height="250" rx="10"/>
    </g>
    <g font-size="15" font-weight="700" fill="#0fa89c">
      <text x="28" y="38">1  Strip</text><text x="225" y="38">2  Crimp</text><text x="422" y="38">3  Insert</text><text x="619" y="38">4  Lock</text>
    </g>

    <!-- 1 strip -->
    <rect x="80" y="112" width="96" height="26" rx="5" fill="#2b6cd4" stroke="#0b0f14" stroke-width="1.5"/>
    <g stroke="#c87533" stroke-width="3" stroke-linecap="round"><line x1="80" y1="118" x2="44" y2="118"/><line x1="80" y1="125" x2="44" y2="125"/><line x1="80" y1="132" x2="44" y2="132"/></g>
    <line x1="44" y1="152" x2="80" y2="152" stroke="#c77d00" stroke-width="1.5"/>
    <text x="62" y="168" text-anchor="middle" font-size="12" fill="#c77d00">4 mm</text>
    <text x="102" y="212" text-anchor="middle">Strip 4 mm, no</text><text x="102" y="228" text-anchor="middle">nicked strands</text>

    <!-- 2 crimp: jaws over contact -->
    <path d="M250 78 h96 v30 h-96 z" fill="#8a8f96" stroke="#0b0f14" stroke-width="1.5"/>
    <path d="M250 150 h96 v30 h-96 z" fill="#8a8f96" stroke="#0b0f14" stroke-width="1.5"/>
    <path d="M298 100 v12 M298 138 v12" stroke="#c4283a" stroke-width="3"/>
    <path d="M293 108 l5 6 l5 -6 M293 142 l5 -6 l5 6" fill="none" stroke="#c4283a" stroke-width="2.5"/>
    <rect x="226" y="115" width="44" height="22" rx="2" fill="#cfd5db" stroke="#0b0f14" stroke-width="1.5"/>
    <rect x="270" y="117" width="60" height="18" rx="2" fill="#b9c0c7" stroke="#0b0f14" stroke-width="1.5"/>
    <rect x="330" y="118" width="50" height="16" rx="4" fill="#2b6cd4" stroke="#0b0f14" stroke-width="1.2"/>
    <text x="299" y="212" text-anchor="middle">CT170-14B-MX23,</text><text x="299" y="228" text-anchor="middle">squeeze to release</text>

    <!-- 3 insert into housing from wire side -->
    <rect x="430" y="80" width="70" height="104" rx="6" fill="#3a3f45" stroke="#0b0f14" stroke-width="1.5"/>
    <rect x="422" y="80" width="10" height="104" rx="2" fill="#f08a24" stroke="#0b0f14" stroke-width="1.2"/>
    <g fill="#1b1f24"><rect x="446" y="94" width="38" height="12" rx="2"/><rect x="446" y="114" width="38" height="12" rx="2"/><rect x="446" y="134" width="38" height="12" rx="2"/><rect x="446" y="154" width="38" height="12" rx="2"/></g>
    <rect x="470" y="135" width="36" height="10" fill="#cfd5db" stroke="#0b0f14" stroke-width="1"/>
    <rect x="506" y="134" width="70" height="12" rx="4" fill="#2b6cd4" stroke="#0b0f14" stroke-width="1"/>
    <path d="M572 160 h-44" stroke="#0fa89c" stroke-width="3"/><path d="M526 160 l10 -6 v12 z" fill="#0fa89c"/>
    <text x="548" y="180" text-anchor="middle" font-size="11" fill="#0fa89c">click</text>
    <text x="496" y="212" text-anchor="middle">From the wire side</text><text x="496" y="228" text-anchor="middle">until it clicks, then tug</text>

    <!-- 4 front cap home -->
    <rect x="660" y="80" width="70" height="104" rx="6" fill="#3a3f45" stroke="#0b0f14" stroke-width="1.5"/>
    <rect x="648" y="80" width="12" height="104" rx="2" fill="#f08a24" stroke="#0b0f14" stroke-width="1.2"/>
    <g stroke="#2b6cd4" stroke-width="10"><line x1="730" y1="100" x2="776" y2="100"/><line x1="730" y1="120" x2="776" y2="120"/><line x1="730" y1="140" x2="776" y2="140"/><line x1="730" y1="160" x2="776" y2="160"/></g>
    <path d="M622 132 h20" stroke="#0fa89c" stroke-width="3"/><path d="M646 132 l-10 -6 v12 z" fill="#0fa89c"/>
    <text x="695" y="212" text-anchor="middle">Push the orange front</text><text x="695" y="228" text-anchor="middle">cap fully home</text>
    <text x="695" y="246" text-anchor="middle" font-size="11" fill="#55606b">(won't go if a pin isn't seated)</text>
  </g>
</svg>
