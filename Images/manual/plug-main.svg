<text x="280" y="224" text-anchor="middle" font-size="11.5" fill="#55606b">Grey cavities are unused. Cavity numbers are moulded on the housing: go by those.</text>
<text x="70" y="250" font-size="12.5" fill="#0b0f14"><tspan font-weight="700">1</tspan>  +12 V permanent (Term30)</text>
