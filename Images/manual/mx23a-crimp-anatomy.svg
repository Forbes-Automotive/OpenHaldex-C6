<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="780" height="330" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0f14">A good MX23A crimp (M23S05K351 contact, side view)</text>

  <!-- wire: insulation from the gap to the right -->
  <rect x="436" y="134" width="320" height="40" rx="6" fill="#2b6cd4" stroke="#0b0f14" stroke-width="1.5"/>
  <!-- bare strands: from the tips to the insulation -->
  <rect x="286" y="141" width="152" height="26" fill="#c87533" stroke="#7a3f12" stroke-width="1"/>
  <g stroke="#7a3f12" stroke-width="0.8">
    <line x1="286" y1="147" x2="438" y2="147"/><line x1="286" y1="153" x2="438" y2="153"/>
    <line x1="286" y1="159" x2="438" y2="159"/><line x1="286" y1="164" x2="438" y2="164"/>
  </g>

  <!-- socket box (mates with the board pin) -->
  <rect x="40" y="122" width="214" height="64" rx="3" fill="#cfd5db" stroke="#0b0f14" stroke-width="2"/>
  <path d="M120 122 l26 -14 l10 0 l0 14" fill="#cfd5db" stroke="#0b0f14" stroke-width="1.5"/>
  <line x1="254" y1="140" x2="296" y2="140" stroke="#0b0f14" stroke-width="2"/>
  <line x1="254" y1="168" x2="296" y2="168" stroke="#0b0f14" stroke-width="2"/>

  <!-- wire barrel, crimped over the strands -->
  <rect x="296" y="128" width="104" height="52" rx="4" fill="#b9c0c7" fill-opacity="0.92" stroke="#0b0f14" stroke-width="2"/>
  <g stroke="#7d868f" stroke-width="1.2"><line x1="318" y1="130" x2="318" y2="178"/><line x1="340" y1="130" x2="340" y2="178"/><line x1="362" y1="130" x2="362" y2="178"/><line x1="384" y1="130" x2="384" y2="178"/></g>
  <!-- bell-mouth flare -->
  <path d="M400 128 L412 120 L412 188 L400 180 Z" fill="#b9c0c7" stroke="#0b0f14" stroke-width="1.5"/>

  <!-- insulation barrel -->
  <rect x="452" y="124" width="62" height="60" rx="5" fill="#b9c0c7" fill-opacity="0.92" stroke="#0b0f14" stroke-width="2"/>
  <path d="M452 124 q31 -18 62 0" fill="none" stroke="#0b0f14" stroke-width="1.5"/>

  <!-- labels -->
  <g font-size="12.5" fill="#0b0f14">
    <text x="147" y="212" text-anchor="middle">Socket: mates with the board pin.</text>
    <text x="147" y="228" text-anchor="middle">Never bend or squash this part.</text>

    <line x1="290" y1="152" x2="250" y2="70" stroke="#0fa89c" stroke-width="1.5"/>
    <text x="246" y="64" text-anchor="end">Strand tips just visible</text>
    <text x="246" y="80" text-anchor="end" fill="#55606b">past the wire barrel</text>

    <line x1="348" y1="128" x2="348" y2="84" stroke="#0fa89c" stroke-width="1.5"/>
    <text x="348" y="62" text-anchor="middle">Wire barrel:</text>
    <text x="348" y="78" text-anchor="middle" fill="#55606b">bare strands only</text>

    <line x1="408" y1="120" x2="432" y2="92" stroke="#0fa89c" stroke-width="1.5"/>
    <text x="436" y="78" fill="#0b0f14">Bell-mouth</text>
    <text x="436" y="94" fill="#55606b">(small flare)</text>

    <line x1="437" y1="176" x2="430" y2="236" stroke="#0fa89c" stroke-width="1.5"/>
    <text x="430" y="252" text-anchor="middle">Insulation ends</text>
    <text x="430" y="268" text-anchor="middle" fill="#55606b">in the gap</text>

    <line x1="514" y1="140" x2="560" y2="92" stroke="#0fa89c" stroke-width="1.5"/>
    <text x="564" y="78">Insulation barrel:</text>
    <text x="564" y="94" fill="#55606b">grips the insulation</text>
  </g>

  <!-- strip length dimension -->
  <g stroke="#c77d00" stroke-width="1.5" fill="#c77d00">
    <line x1="286" y1="190" x2="286" y2="300"/>
    <line x1="436" y1="180" x2="436" y2="300"/>
    <line x1="292" y1="292" x2="430" y2="292"/>
    <path d="M286 292 l9 -5 v10 z"/><path d="M436 292 l-9 -5 v10 z"/>
  </g>
  <text x="361" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#c77d00">Strip 3.7 to 4.3 mm</text>
  <text x="640" y="300" text-anchor="middle" font-size="12" fill="#55606b">0.5 / 0.85 / 1.25 mm² wire</text>
</svg>
