<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="780" height="230" fill="#ffffff"/>
  <defs>
    <g id="ins"><rect x="0" y="0" width="90" height="34" rx="6" fill="#2b6cd4" stroke="#0b0f14" stroke-width="1.5"/></g>
  </defs>
  <text x="390" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0f14">Check the stripped end before crimping</text>

  <!-- 1 splayed -->
  <g transform="translate(40,70)">
    <use href="#ins" x="70"/>
    <g stroke="#c87533" stroke-width="3" stroke-linecap="round">
      <line x1="70" y1="10" x2="20" y2="-14"/><line x1="70" y1="14" x2="14" y2="6"/><line x1="70" y1="18" x2="22" y2="20"/>
      <line x1="70" y1="22" x2="12" y2="34"/><line x1="70" y1="26" x2="24" y2="50"/>
    </g>
    <text x="80" y="98" text-anchor="middle" font-size="13" fill="#0b0f14">Splayed strands</text>
  </g>
  <!-- 2 cut -->
  <g transform="translate(225,70)">
    <use href="#ins" x="70"/>
    <g stroke="#c87533" stroke-width="3" stroke-linecap="round">
      <line x1="70" y1="10" x2="26" y2="10"/><line x1="70" y1="15" x2="52" y2="15"/><line x1="70" y1="20" x2="26" y2="20"/><line x1="70" y1="25" x2="48" y2="25"/>
    </g>
    <text x="80" y="98" text-anchor="middle" font-size="13" fill="#0b0f14">Cut strands</text>
  </g>
  <!-- 3 nicked -->
  <g transform="translate(410,70)">
    <use href="#ins" x="70"/>
    <g stroke="#c87533" stroke-width="3" stroke-linecap="round">
      <line x1="70" y1="10" x2="26" y2="10"/><line x1="70" y1="15" x2="26" y2="15"/><line x1="70" y1="20" x2="26" y2="20"/><line x1="70" y1="25" x2="26" y2="25"/>
    </g>
    <path d="M58 6 l4 8 l4 -8" fill="none" stroke="#c4283a" stroke-width="2.5"/>
    <text x="80" y="98" text-anchor="middle" font-size="13" fill="#0b0f14">Nicked strands</text>
  </g>
  <!-- 4 good -->
  <g transform="translate(595,70)">
    <use href="#ins" x="70"/>
    <g stroke="#c87533" stroke-width="3" stroke-linecap="round">
      <line x1="70" y1="10" x2="26" y2="10"/><line x1="70" y1="15" x2="26" y2="15"/><line x1="70" y1="20" x2="26" y2="20"/><line x1="70" y1="25" x2="26" y2="25"/>
    </g>
    <line x1="26" y1="50" x2="70" y2="50" stroke="#c77d00" stroke-width="1.5"/>
    <text x="48" y="66" text-anchor="middle" font-size="11" fill="#c77d00">4 mm</text>
    <text x="80" y="98" text-anchor="middle" font-size="13" fill="#0b0f14">Straight, whole, 4 mm</text>
  </g>

  <!-- verdicts -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="120" y="210" fill="#c4283a">&#10007; Reject</text>
    <text x="305" y="210" fill="#c4283a">&#10007; Reject</text>
    <text x="490" y="210" fill="#c4283a">&#10007; Reject</text>
    <text x="675" y="210" fill="#2e9e4f">&#10003; Good</text>
  </g>
</svg>
