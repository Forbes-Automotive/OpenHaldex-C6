; OpenHaldex has its OWN PlatformIO core folder (V11.00.1). custom_sdkconfig below makes
; pioarduino rebuild Espressif's libraries smaller, and it does that INSIDE the packages
; folder - which every other ESP32 project shares. With its own folder, OpenHaldex never
; touches the shared C:\.platformio packages and the other projects never undo it.
; First build here downloads the platform + packages (~1.5-2 GB) and compiles the
; libraries (long, once); after that it builds as normal. Same platform version as
; every other project (55.03.312-1).
[platformio]
core_dir = C:/.platformio-openhaldex

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-mini-1-n4
framework = arduino
monitor_speed = 500000

board_build.filesystem = littlefs
; Pack data/ into the LittleFS image gzipped (served transparently) - see tools/gzip_webui.py
extra_scripts = pre:tools/gzip_webui.py
board_build.partitions = src/partitions_4mb.csv

; Flash space (V11.00.1): Espressif's libraries rebuilt without the things OpenHaldex
; never uses. The partitions are NOT changed, so OTA keeps working for every unit.
; "is not set" lines turn an option off (the quotes keep them from being read as comments).
custom_sdkconfig =
    ; no library log messages (they only go to the serial port; our own DEBUG() is separate)
    CONFIG_LOG_DEFAULT_LEVEL_NONE=y
    '# CONFIG_LOG_DEFAULT_LEVEL_ERROR is not set'
    CONFIG_LOG_DEFAULT_LEVEL=0
    CONFIG_LOG_MAXIMUM_LEVEL=0
    ; library self-checks stay in, but without their file names / message text
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
    '# CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE is not set'
    ; error codes print as numbers instead of names (drops the name table)
    '# CONFIG_ESP_ERR_TO_NAME_LOOKUP is not set'
    ; no crash dump - there's no partition for one, so it never worked anyway
    CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
    '# CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH is not set'
    '# CONFIG_ESP_COREDUMP_ENABLE is not set'
    ; WiFi extras not used: distance measuring (FTM), WPA3 and OWE. The access point is
    ; WPA2; the home WiFi bridge still joins WPA2 and WPA2/WPA3 mixed routers, but not a
    ; WPA3-ONLY router
    '# CONFIG_ESP_WIFI_FTM_ENABLE is not set'
    '# CONFIG_ESP_WIFI_ENABLE_WPA3_SAE is not set'
    '# CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA is not set'
    ; Possible later, once tested on the bench (bigger savings, more to check):
    ;   '# CONFIG_LWIP_IPV6 is not set'                     (IPv6 - AsyncTCP / mDNS must still build)
    ;   '# CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT is not set'   (WPA2-Enterprise)

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Optimized stack sizes
    ; AsyncTCP defaults to 16 KB; 8 KB is the original upstream size and frees 8 KB of heap (C6 RAM is tight with BLE)
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    #-D CONFIG_LWIP_TCPIP_TASK_STACK_SIZE=3072
    #-D CONFIG_ESP_MAIN_TASK_STACK_SIZE=6144
    
     # Network optimization
    -D CONFIG_LWIP_MAX_SOCKETS=8
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    
    # BLE (NimBLE): peripheral-only GATT server for the DashCAN app. Two links, not one: a phone
    # whose app was killed can keep its old link open, and with a single slot the device would stop
    # advertising until reboot (see BleServerCallbacks::onConnect in OpenHaldexC6_BLE.cpp).
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

lib_deps = 
    # Lightweight web server
    mathieucarbou/AsyncTCP@^3.1.4
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.3.0
    
    # Existing dependencies
    https://github.com/rwmingis/InterruptButton
    https://github.com/vortigont/ESPAsyncButton

lib_ignore = 
    Async TCP
    AsyncTCP_RP2040W
    AsyncTCP_SSL
    ESPUI

monitor_filters = 
    esp32_exception_decoder
    colorize